name: Bug report
description: Report something in Hyangsang that doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can, since it
        helps a lot with reproducing it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I checked the [open issues](https://github.com/Gawkat/hyangsang/issues) and this bug hasn't been reported yet.
          required: true
        - label: I can reproduce the bug with the latest version of the app.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug in as much detail as possible. Screenshots or a screen recording help too.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        If the bug is in an article or a book, say which one, such as a link to the article.
        Please link to articles instead of pasting their text.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the app's settings.
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: e.g. Android 15
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and screen size
      placeholder: e.g. Pixel 8, phone / Galaxy Tab S9, tablet
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Logs, settings you've changed, or anything else that might be related.
    validations:
      required: false
